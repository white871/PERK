
pcm.speakerbonnet {
	type hw card 0
}

pcm.dmixer {
	type dmix
	ipc_key 1024
	ipc_perm 0666
	slave {
		pcm "speakerbonnet"
		period_time 0
		period_size 1024
		buffer_size 8192
		rate 44100
		channels 2
	}
}

pcm.softvol {
	type softvol
	slave {
	   pcm "dmixer"
	}
	control {
		name "Softmaster"
		card 0
	}
}
pcm.!default {
	type plug
	slave.pcm "softvol"
}
ctl.!default{
	type hw
	card 0
}
